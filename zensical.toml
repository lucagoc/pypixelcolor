[project]
site_name = "pypixelcolor"
site_url = "https://lucagoc.github.io/pypixelcolor/"
repo_url = "https://github.com/lucagoc/pypixelcolor"
repo_name = "lucagoc/pypixelcolor"
copyright = 'Project "pypixelcolor" by lucagoc and contributors. Licensed under MIT.'

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    { "Installation" = "getting_started/installation.md" },
    { "Using CLI" = "getting_started/cli.md" },
    { "Using WebSocket" = "getting_started/websocket.md" },
    { "Using Python library" = "getting_started/library.md" },
  ]},
  { "Commands" = [
    { "Sending Content" = "commands/content.md" },
    { "Clock Mode" = "commands/clock.md" },
    { "Managing Data" = "commands/data.md" },
    { "Device Settings" = "commands/settings.md" },
    { "Others" = "commands/other.md" },
  ]},
  { "Reference" = [
    { "Sync Client" = "reference/sync_client.md" },
    { "Async Client" = "reference/async_client.md" },
  ]},
  { "Troubleshooting" = [
    { "Bluetooth Connection" = "troubleshooting/bluetooth_connection.md" },
  ]},
  { "Guides" = [
    { "Android BLE Logs" = "guides/android_ble_logs.md" },
  ]},
]

extra_css = ["assets/css/custom.css"]

[project.theme]
language = "en"
features = [
  "navigation.tabs",
  "navigation.sections",
  "content.code.copy",
  "content.action.edit",
]
logo = "assets/pngs/logo.png"

[project.theme.font]
text = "Red Hat Display"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "black"
accent = "indigo"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "indigo"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/lucagoc/pypixelcolor"

[[project.extra.social]]
icon = "fontawesome/solid/coffee"
link = "https://ko-fi.com/lucagoc"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.markdown_extensions]
attr_list = {}
admonition = {}
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"

[project.extra.version]
provider = "mike"
default = "latest"
