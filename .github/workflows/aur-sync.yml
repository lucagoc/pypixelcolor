name: Sync AUR Git Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync-aur:
    runs-on: ubuntu-latest
    environment:
      name: AUR
      url: https://aur.archlinux.org/packages/python-pypixelcolor-git
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate package version
        id: pkgver
        run: |
          # Compute dynamic VCS version from git history and tags
          VERSION=$(git describe --long --tags 2>/dev/null | sed 's/^v//;s/\([^-]*-g\)/r\1/;s/-/./g' || printf "r%s.%s" "$(git rev-list --count HEAD)" "$(git rev-parse --short HEAD)")
          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not calculate package version from git."
            exit 1
          fi
          echo "Computed pkgver: $VERSION"
          echo "val=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup SSH & Sync with AUR
        env:
          SSH_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          NEW_PKGVER: ${{ steps.pkgver.outputs.val }}
        run: |
          # Configure SSH authentication
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts

          # Configure Git user identity for AUR commits
          git config --global user.name "Lucas Balmès"
          git config --global user.email "lucagoc@pm.me"

          # Clone the AUR repository
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o StrictHostKeyChecking=accept-new" \
            git clone ssh://aur@aur.archlinux.org/python-pypixelcolor-git.git aur_repo

          # Update pkgver in PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=${NEW_PKGVER}/" aur_repo/PKGBUILD

          # Generate updated .SRCINFO inside builder's writable home directory in the container
          docker run --rm -v "$PWD/aur_repo/PKGBUILD":/tmp/PKGBUILD:ro archlinux:base-devel bash -c "
            useradd -m builder
            cp /tmp/PKGBUILD /home/builder/PKGBUILD
            cd /home/builder
            chown builder:builder PKGBUILD
            su builder -c 'makepkg --printsrcinfo'
          " > aur_repo/.SRCINFO

          # Stage changes and push to AUR if differences are found
          cd aur_repo
          git add PKGBUILD .SRCINFO
          if git diff --staged --quiet; then
            echo "No changes detected. AUR package is already up to date."
          else
            git commit -m "chore: update git snapshot to ${NEW_PKGVER}"
            GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o StrictHostKeyChecking=accept-new" \
              git push origin master
          fi
